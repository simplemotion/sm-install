# The checks that are specific to THIS repo — the installer's output format.
#
# Everything generic (required files, ASSIGN.md, CHANGE.md shape, the develop
# tag stream, .gitmodules, forbidden artefacts, the sm- prefix rule, SECURE.md)
# moved to the shared public-safe gate in simplemotion/.github, called from
# sm-pr.yml. This file holds only what no other repo needs.
#
# These are the most important checks here: sm-install ships a PUBLIC installer
# that users run. A renderer divergence between the bash and PowerShell paths
# gives one platform a different install, and every past divergence was silent.
#
# `Shell syntax` (bash -n) was dropped as subsumed: ShellCheck cannot lint a
# file it cannot parse, so a syntax error fails there anyway.

name: Output format

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  render:
    name: Output format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Renderer contract
        # The output format is drawn by this repo's two scripts and by the
        # sm-welcome binary, and every past divergence between them was
        # silent — a green that was 32 in one file and 92 in another, a
        # continuation indent five columns off, a rule that came out two
        # characters long on macOS only. None of it fails a build on its
        # own, so it is asserted.
        run: bash tests/render-test.sh

      - name: Transcript renders
        # Cheap guard that the preview still runs: it is the only way to
        # review a format change without performing an install.
        run: |
          set -euo pipefail
          bash tests/render-preview.sh update  > /dev/null
          bash tests/render-preview.sh install > /dev/null

      - name: Renderer parity (bash vs PowerShell)
        # The format has two implementations and neither is the authority.
        # This renders the same cases through both and fails on any byte of
        # difference. It caught nothing on introduction because the port was
        # written against it — but it is what stops the next one-sided change
        # walking off, which is exactly what happened when #82 moved the shell
        # rule to width 36 and left PowerShell on 56 for two days.
        #
        # pwsh ships on ubuntu-latest, so this needs no Windows runner: the
        # renderer is string formatting, and string formatting travels.
        run: bash tests/render-parity.sh

      - name: ShellCheck
        # SC2218 is excluded, not fixed: it fires on sm_mktemp, write_receipt
        # and sm_interactive, all of which are defined ABOVE their call sites
        # in the same file. It is unreliable for sourced libraries, and the
        # two pre-existing hits predate this job.
        run: shellcheck -S warning -e SC2218 sm-install-lib.sh sm-install.sh sm-welcome.sh tests/*.sh
