name: sm-pages

# Build the two installer sites from one source and deploy each to its own
# Azure Static Web App in rg-sm-portal-se, beside the sm-website SWAs
# (Greg, 2026-10-12):
#   install.simplemotion.dev  internal copy  _site/int  sm-portal-install-int
#   install.simplemotion.com  external copy  _site/ext  sm-portal-install-ext
# One SWA cannot serve different content for each host name, so each copy has
# its own SWA. Until 2026-10-12 both were GitHub Pages sites; the external
# one was the gh-pages branch of simplemotion/sm-install-ext, now archived.
# The workflow keeps its name so that links to its runs do not break.
# The welcome page's interactive logic is authored in TypeScript
# (sm-welcome/sm-welcome.ts), bundled + minified by esbuild and inlined
# into the served HTML by sm-build.ts. No hand-written .js is committed.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: sm-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Build _site/int and _site/ext (esbuild + inline)
        run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: site-int
          path: _site/int
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: site-ext
          path: _site/ext
          include-hidden-files: true
          if-no-files-found: error

  deploy-swa:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - copy: int
            swa: sm-portal-install-int
          - copy: ext
            swa: sm-portal-install-ext
    name: deploy-swa (${{ matrix.copy }})
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: site-${{ matrix.copy }}
          path: site

      # OIDC, as in sm-website: the sm-deploy-portal app trusts this repo's
      # main branch, and has Contributor on rg-sm-portal-se.
      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Fetch SWA deployment token
        id: token
        run: |
          set -euo pipefail
          TOKEN="$(az staticwebapp secrets list --name '${{ matrix.swa }}' --resource-group rg-sm-portal-se --query properties.apiKey -o tsv)"
          test -n "$TOKEN"
          echo "::add-mask::$TOKEN"
          {
            echo "value<<EOF"
            echo "$TOKEN"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.token.outputs.value }}
          action: upload
          app_location: site
          api_location: ""
          skip_app_build: true
          output_location: ""

      # Verify the effect: the SWA serves this build's installer.
      - name: Check the deployed installer
        run: |
          set -euo pipefail
          host="$(az staticwebapp show --name '${{ matrix.swa }}' --resource-group rg-sm-portal-se --query defaultHostname -o tsv)"
          want="$(sha256sum site/sm-install.sh | cut -d' ' -f1)"
          for _ in $(seq 1 20); do
            got="$(curl -fsS "https://${host}/sm-install.sh" | sha256sum | cut -d' ' -f1 || true)"
            [ "$got" = "$want" ] && { echo "::notice::${host}/sm-install.sh matches this build"; exit 0; }
            sleep 15
          done
          echo "::error::${host}/sm-install.sh does not match this build" >&2
          exit 1

      # The internal copy needs staff sign-in for its pages, and keeps its
      # scripts open. Check both as a visitor who has not signed in.
      - name: Check staff sign-in
        if: matrix.copy == 'int'
        run: |
          set -euo pipefail
          host="$(az staticwebapp show --name '${{ matrix.swa }}' --resource-group rg-sm-portal-se --query defaultHostname -o tsv)"
          bad=0
          for path in release/ sm-simplicity/ release/sm-welcome/; do
            code="$(curl -s -o page.html -w '%{http_code}' "https://${host}/${path}")"
            # SWA can send the rewritten sign-in page with 401 or 200.
            if { [ "$code" = 401 ] || [ "$code" = 200 ]; } && grep -q 'SimpleMotion staff only' page.html && ! grep -q '<pre><code>' page.html; then
              echo "::notice::/${path} needs sign-in"
            else
              echo "::error::/${path} gave HTTP ${code} without sign-in" >&2; bad=1
            fi
          done
          for path in sm-install.sh sm-install.ps1 sm-install-lib.sh sm-welcome.sh sm-simplicity.ps1; do
            code="$(curl -s -o /dev/null -w '%{http_code}' "https://${host}/${path}")"
            [ "$code" = 200 ] || { echo "::error::/${path} gave HTTP ${code}: the scripts must stay open" >&2; bad=1; }
          done
          exit "$bad"
