name: sm-install-smoke-test

# Smoke test for the public installer: on ubuntu + macOS, install sm-welcome
# from the release channel via the generic installer and assert that (1) cosign
# provenance verifies and (2) the binary runs. Guards against regressions
# like the sm-ci signer-identity mismatch fixed in #31. Mode=install only —
# no interactive onboarding (that's sm-welcome.{sh,ps1}'s Section 3).
#
# WINDOWS JOBS REMOVED 2026-08-05. `windows-pwsh` and `windows-ps51` installed
# sm-welcome.exe and asserted it ran. 3400-0009-SM-Welcome dropped its two
# *-pc-windows-msvc triples that day, so no sm-welcome.exe is published any
# more and both jobs would fail on a missing asset — a red schedule every
# Monday testing a platform we no longer ship.
#
# The .ps1 path filters went with them: with no job exercising sm-install.ps1
# or sm-install-lib.ps1, triggering a run on their changes only produced a
# green tick that proved nothing. Restore both together if Windows returns.
#
# NOTE, still outstanding: sm-install.ps1 and sm-welcome.ps1 are unchanged and
# still served from install.simplemotion.com, so a Windows user following the
# documented one-liner now fails on a missing release asset rather than being
# told Windows is unsupported. Deciding that message is a product call, not a
# CI one — see 3400-0009-SM-Welcome's CHANGE.md entry for the same note.

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'   # Mondays 06:17 UTC
  push:
    branches: [main]
    paths:
      - 'sm-install.sh'
      - 'sm-install-lib.sh'
      - 'sm-install.ps1'
      - 'sm-install-lib.ps1'
      - '.github/workflows/sm-install-smoke-test.yml'

permissions:
  contents: read

env:
  PKG: sm-welcome
  SRC: 3400-0000-SM-Software/3400-0009-SM-Welcome
  CH: release
  # Authenticate the installer's api.github.com calls so shared-runner IPs
  # don't hit the 60/hr unauthenticated rate limit (the macOS flake).
  GH_TOKEN: ${{ github.token }}
  # Source the library from THIS CHECKOUT, not from production.
  #
  # This job runs the repo's `sm-install.sh`, but that script fetches
  # `sm-install-lib.sh` over the network, so it was running the checked-out
  # script against whatever the live site happened to be serving. Any commit
  # changing both files therefore tested a mismatched pair, and on a merge it
  # RACED the Pages deploy: #84 failed with `sm_phase: command not found`
  # because the smoke test started at 03:49:44 and sm-pages did not finish
  # until 03:50:11. Production itself was consistent the whole time.
  #
  # Testing the checkout against the checkout is what this job was always
  # for. What it does NOT cover is the deployed pair — the scheduled Monday
  # run does that, because by then main and the site agree.
  SM_INSTALL_BASE: file://${{ github.workspace }}

jobs:
  windows:
    name: Install + verify (pwsh)
    runs-on: windows-latest
    # The Bash side wants a file:// URL because curl reads it; PowerShell wants
    # a plain directory path, because Get-SmSibling falls back to Get-Content
    # for anything that is not http(s). Same intent, two spellings.
    env:
      SM_INSTALL_BASE: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7

      # Windows binaries returned on 2026-08-21 (3400-0009-SM-Welcome#235), but
      # a GA is a PROMOTION of an earlier build, so `release` keeps shipping
      # whatever it was promoted from until the next one. Asserting against an
      # asset the channel does not carry yet would just be a red tick that
      # tells you nothing, so this probes first and says which case it is.
      #
      # The skip is deliberately loud. A job that quietly passes while testing
      # nothing is the exact shape this repo keeps getting caught by.
      - name: Does the channel carry a Windows asset yet?
        id: probe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $asset = "$env:PKG-win-x64.exe"
          $repo  = "simplemotion/sm-$env:CH"
          $names = @(gh release view --repo $repo --json assets --jq '.assets[].name')
          if ($names -contains $asset) {
            "present=true" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
            Write-Host "$asset is published on $env:CH - asserting for real."
          } else {
            "present=false" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
            Write-Host "::notice::SKIPPED, not passed: $repo carries no $asset. Windows triples were restored on 2026-08-21 and the develop channel has the assets, but a GA is a promotion of an earlier build so release will not carry them until the next promote. This job starts asserting on its own from that point with no change here."
          }

      - name: Install + verify (pwsh)
        if: steps.probe.outputs.present == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $log = & ./sm-install.ps1 -Package $env:PKG -AssetSuffix short `
                   -SourceRepo $env:SRC -Channel $env:CH -Mode install 2>&1 | Out-String
          Write-Host $log
          if ($LASTEXITCODE -ne 0) { throw "sm-install.ps1 exited $LASTEXITCODE" }
          if ($log -notmatch 'Provenance verified') { throw 'provenance NOT verified' }
          $exe = Join-Path $HOME ".simplemotion\bin\$env:PKG.exe"
          if (-not (Test-Path $exe)) { throw "$exe is missing after install" }
          & $exe -V
          if ($LASTEXITCODE -ne 0) { throw "$exe -V exited $LASTEXITCODE" }

  unix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install + verify (bash)
        shell: bash
        run: |
          set -euo pipefail
          log=$(bash sm-install.sh --package "$PKG" --asset-suffix short --source-repo "$SRC" --channel "$CH" --mode install 2>&1) || { echo "$log"; exit 1; }
          echo "$log"
          echo "$log" | grep -q 'Provenance verified' || { echo 'provenance NOT verified' >&2; exit 1; }
          "$HOME/.simplemotion/bin/sm-welcome" -V
