<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SimpleMotion - {{PAGE_TITLE}}</title>
<meta name="description" content="SimpleMotion install commands: {{PAGE_TITLE}}">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0a0a0a;color:#e8e8e8;font-family:'Noto Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
  .card{max-width:1100px;width:100%;padding:40px;background:#1a1a1a;border-radius:12px}
  .banner{display:block;margin:0 auto 32px;max-width:647px;width:100%;height:auto}
  h1{font-size:1.5rem;font-weight:400;margin-bottom:8px}
  h1 .ch{color:#ff6900;font-weight:600}
  .subtitle{color:#999;font-size:0.95rem;margin-bottom:24px;line-height:1.5}
  .nav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:28px}
  .nav a{color:#999;text-decoration:none;padding:6px 14px;border:1px solid #2a2a2a;border-radius:4px;font-size:0.8rem}
  .nav a.active{background:#ff6900;border-color:#ff6900;color:#fff}
  .nav a.locked{color:#555;border-color:#1f1f1f;cursor:not-allowed}
  .nav a.signin{margin-left:auto;color:#ff6900;border-color:#ff6900}
  h2{font-size:1.05rem;font-weight:600;margin:24px 0 8px}
  .os{color:#999;font-size:0.8rem;margin:12px 0 4px}
  pre{background:#0a0a0a;border:1px solid #2a2a2a;border-radius:8px;padding:12px 16px;white-space:pre-wrap;overflow-wrap:anywhere;flex:1;min-width:0}
  .cmd{display:flex;gap:8px;align-items:stretch}
  .copy{flex:none;background:#15803d;border:1px solid #22c55e;border-radius:8px;color:#fff;padding:0 16px;font-family:inherit;font-size:0.8rem;font-weight:600;cursor:pointer}
  .copy:hover{background:#16a34a}
  .copy.copied{background:#22c55e;color:#0a0a0a}
  code{font-family:'SF Mono','Fira Code','Courier New',monospace;font-size:0.82rem;color:#e8e8e8}
  .footer a{color:#ff6900;text-decoration:none}
  .crumb{margin-bottom:16px;font-size:0.85rem}
  .crumb a{color:#ff6900;text-decoration:none}
  h2 a{color:#e8e8e8;text-decoration:none}
  h2 a:hover{color:#ff6900}
  .about{color:#999;font-size:0.9rem;margin:0 0 4px}
  .footer{margin-top:32px;color:#666;font-size:0.8rem;line-height:1.6}
</style>
</head>
<body>
<div class="card">
  <!--SM_BANNER-->
  {{CRUMB}}
  <h1>{{HEADING}}</h1>
  <p class="subtitle">{{SUMMARY}}</p>
  <nav class="nav" aria-label="Channels">{{NAV}}<a class="signin" id="signin" href="/.auth/login/aad" hidden>Staff sign in</a></nav>
<!--SM_COMMANDS_BEGIN-->
{{BODY}}
<!--SM_COMMANDS_END-->
  <p class="footer">Each installer checks the SHA256 and the build attestation of every file before it installs it.<br>
  Source: <a href="https://github.com/simplemotion/sm-install#readme">simplemotion/sm-install</a></p>
</div>
<!--SM_CHANNEL_SCRIPT-->
</body>
</html>
